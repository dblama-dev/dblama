name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: binary

      - name: Unit tests
        run: go test ./...

      # Docker is preinstalled on ubuntu-latest; testcontainers boots
      # the mysql:8.4 + mariadb:11.4 matrix, so no -short mode here.
      - name: Integration tests
        run: go test -tags integration ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 LTS, not 20: vitest 5 requires ^22.12.0 || ^24.0.0 || >=26.0.0.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test real browser, API and database
        run: ./scripts/check-e2e.sh '${{ matrix.engine }}'
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.engine }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
