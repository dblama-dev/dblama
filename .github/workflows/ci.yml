name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: binary
          working-directory: server

      - name: Unit tests
        run: go test ./...

      # Docker is preinstalled on ubuntu-latest; testcontainers boots
      # the mysql:8.4 + mariadb:11.4 matrix, so no -short mode here.
      - name: Integration tests
        run: go test -tags integration ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 LTS, not 20: vitest 5 requires ^22.12.0 || ^24.0.0 || >=26.0.0.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
